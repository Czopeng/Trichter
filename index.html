<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trichter Global Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<style>
  :root { --main-color: #00ff88; --bg: #111; --box-bg: #222; }
  body { font-family: Arial, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 0; }
  
  h1 { margin-top: 30px; margin-bottom: 5px; color: var(--main-color); text-transform: uppercase; letter-spacing: 2px; }
  h2 { margin-top: 0; color: #aaa; font-weight: normal; font-size: 20px; letter-spacing: 1px; }
  
  /* Tabs System */
  .tabs { display: flex; justify-content: center; margin-top: 30px; border-bottom: 2px solid #333; }
  .tab-btn { background: none; border: none; color: #888; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .tab-btn:hover { color: white; }
  .tab-btn.active { color: var(--main-color); border-bottom: 3px solid var(--main-color); }
  
  /* Content Areas */
  .tab-content { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
  .tab-content.active { display: block; }
  
  /* Leaderboard Table */
  table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--box-bg); border-radius: 10px; overflow: hidden; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
  th { background: #1a1a1a; color: #aaa; }
  tr:nth-child(1) { color: gold; font-weight: bold; font-size: 1.2em; } 
  tr:nth-child(2) { color: silver; font-weight: bold; font-size: 1.1em; } 
  tr:nth-child(3) { color: #cd7f32; font-weight: bold; } 
  .date-col { font-size: 0.9em; color: #888; }
  
  /* Stats Filter & Chips */
  .filter-box { background: var(--box-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
  select { padding: 10px; font-size: 18px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; margin-left: 10px; cursor: pointer; }
  
  .chip-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
  .chip { background: #333; border: 1px solid #444; border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
  .chip-color { width: 12px; height: 12px; border-radius: 50%; }
  .chip-close { cursor: pointer; color: #ff4444; font-weight: bold; font-size: 16px; padding: 0 5px; }
  
  /* Chart Container */
  .chart-container { background: var(--box-bg); padding: 20px; border-radius: 10px; position: relative; height: 500px; width: 100%; box-sizing: border-box; }
</style>
</head>
<body>

<h1>Trichter Hall of Fame</h1>
<h2>Campus Festival 2026</h2>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('leaderboard', this)">Top Zeiten</button>
  <button class="tab-btn" onclick="switchTab('stats', this)">Spieler Analyse</button>
</div>

<div id="leaderboard" class="tab-content active">
  <table id="leaderboardTable">
    <tr><th>Platz</th><th>Name</th><th>Zeit (s)</th><th>Datum & Uhrzeit</th></tr>
    </table>
</div>

<div id="stats" class="tab-content">
  <div class="filter-box">
    <label for="playerSelect" style="font-size: 18px; font-weight: bold;">Spieler hinzufügen (Max. 5):</label>
    <select id="playerSelect" onchange="addPlayer()">
      <option value="">-- Wähle einen Namen --</option>
    </select>
    
    <div class="chip-container" id="chipContainer">
      </div>
  </div>
  
  <div class="chart-container">
    <canvas id="playerChart"></canvas>
  </div>
</div>

<script>
// ===== Supabase Config =====
const supabaseUrl = "https://yslvyqtweolxxmhwvcel.supabase.co/rest/v1/trichter_times";
const supabaseKey = "sb_publishable_QaxGMezmwqEc1zKrfV9CKQ_9GFsidns";

let myChart = null; 
let selectedPlayers = [];
// 5 knallige Festival-Farben für die Spieler im Graphen
const chartColors = ['#00ff88', '#00d4ff', '#ff007f', '#ffaa00', '#b500ff'];

// ===== Tab Logik =====
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  
  if (tabId === 'stats') {
    loadPlayerDropdown();
  } else {
    loadLeaderboard();
  }
}

// ===== Datum formatieren (z.B. Donnerstag, 28.05.2026, 14:30 Uhr) =====
function formatDateTime(isoString) {
  const date = new Date(isoString);
  const optionsDate = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
  const dateStr = date.toLocaleDateString('de-DE', optionsDate);
  const timeStr = date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return `${dateStr}, ${timeStr} Uhr`;
}

// ===== Leaderboard laden =====
async function loadLeaderboard() {
  try {
    const response = await fetch(supabaseUrl + "?select=player_name,time_s,created_at&order=time_s.asc&limit=50", {
      headers: { "apikey": supabaseKey, "Authorization": "Bearer " + supabaseKey }
    });
    const data = await response.json();
    
    let html = "<tr><th>Platz</th><th>Name</th><th>Zeit (s)</th><th>Datum & Uhrzeit</th></tr>";
    data.forEach((entry, index) => {
      html += `<tr>
        <td>${index + 1}</td>
        <td>${entry.player_name}</td>
        <td>${entry.time_s.toFixed(3)}</td>
        <td class="date-col">${formatDateTime(entry.created_at)}</td>
      </tr>`;
    });
    document.getElementById("leaderboardTable").innerHTML = html;
  } catch (err) {
    console.error("Fehler beim Laden des Leaderboards", err);
  }
}

// ===== Dropdown mit Namen füllen =====
async function loadPlayerDropdown() {
  try {
    const response = await fetch(supabaseUrl + "?select=player_name", {
      headers: { "apikey": supabaseKey, "Authorization": "Bearer " + supabaseKey }
    });
    const data = await response.json();
    
    const uniquePlayers = [...new Set(data.map(item => item.player_name))].sort();
    const select = document.getElementById('playerSelect');
    
    select.innerHTML = '<option value="">-- Wähle einen Namen --</option>';
    uniquePlayers.forEach(player => {
      select.innerHTML += `<option value="${player}">${player}</option>`;
    });
  } catch (err) {}
}

// ===== Spieler hinzufügen (Chips System) =====
function addPlayer() {
  const select = document.getElementById('playerSelect');
  const name = select.value;
  
  if (name && !selectedPlayers.includes(name)) {
    if (selectedPlayers.length >= 5) {
      alert("Du kannst maximal 5 Spieler gleichzeitig vergleichen!");
      select.value = "";
      return;
    }
    selectedPlayers.push(name);
    updateChips();
    loadChartData();
  }
  select.value = ""; // Reset Dropdown
}

// ===== Spieler entfernen =====
function removePlayer(name) {
  selectedPlayers = selectedPlayers.filter(p => p !== name);
  updateChips();
  loadChartData();
}

// ===== Chips rendern =====
function updateChips() {
  const container = document.getElementById('chipContainer');
  container.innerHTML = "";
  
  selectedPlayers.forEach((player, index) => {
    const color = chartColors[index];
    container.innerHTML += `
      <div class="chip">
        <div class="chip-color" style="background-color: ${color};"></div>
        ${player}
        <div class="chip-close" onclick="removePlayer('${player}')">✕</div>
      </div>
    `;
  });
}

// ===== Daten laden & Chart updaten =====
async function loadChartData() {
  if (selectedPlayers.length === 0) {
    if (myChart) myChart.destroy();
    return;
  }

  try {
    // Parallele Abfragen für jeden ausgewählten Spieler an Supabase
    const promises = selectedPlayers.map(name => 
      fetch(supabaseUrl + `?select=time_s,created_at&player_name=eq.${encodeURIComponent(name)}&order=created_at.asc`, {
        headers: { "apikey": supabaseKey, "Authorization": "Bearer " + supabaseKey }
      }).then(res => res.json())
    );
    
    const results = await Promise.all(promises);
    
    // Datasets für Chart.js aufbereiten
    const datasets = results.map((playerData, index) => {
      const dataPoints = playerData.map(entry => ({
        x: new Date(entry.created_at), // Zeit auf der X-Achse
        y: entry.time_s                // Sekunden auf der Y-Achse
      }));
      
      return {
        label: selectedPlayers[index],
        data: dataPoints,
        borderColor: chartColors[index],
        backgroundColor: chartColors[index],
        borderWidth: 2,
        pointRadius: 6,
        pointHoverRadius: 8,
        tension: 0.1 // Leicht geschwungen, aber nah an den Messpunkten
      };
    });

    drawChart(datasets);
  } catch (err) {
    console.error("Fehler beim Laden der Chart-Daten", err);
  }
}

// ===== Chart.js Zeichnen =====
function drawChart(datasets) {
  const ctx = document.getElementById('playerChart').getContext('2d');
  
  if (myChart) {
    myChart.destroy();
  }

  myChart = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
          time: {
            tooltipFormat: 'dd.MM.yyyy HH:mm',
            displayFormats: {
              hour: 'HH:mm',
              day: 'dd.MM'
            }
          },
          grid: { color: '#333' },
          ticks: { color: '#aaa' }
        },
        y: {
          title: { display: true, text: 'Trichterzeit (Sekunden)', color: '#aaa' },
          beginAtZero: false,
          grid: { color: '#333' },
          ticks: { color: '#aaa' }
        }
      },
      plugins: {
        legend: { labels: { color: 'white', font: { size: 14 } } },
        tooltip: {
          callbacks: {
            label: function(context) {
              return `${context.dataset.label}: ${context.parsed.y.toFixed(3)} s`;
            }
          }
        }
      }
    }
  });
}

// Beim Start das Leaderboard laden
loadLeaderboard();
// Alle 10 Sekunden refreshen
setInterval(() => {
  if (document.getElementById('leaderboard').classList.contains('active')) {
    loadLeaderboard();
  }
}, 10000);

</script>
</body>
</html>
